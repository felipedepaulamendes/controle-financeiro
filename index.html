<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Um organizador financeiro pessoal simples." />
  <title>Meu Orçamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">ORGANIZADOR FINANCEIRO</p>
      <h1>Meu Orçamento</h1>
      <p class="subtitle">Cuide do seu dinheiro, uma decisão por vez.</p>
    </header>

    <section class="summary" aria-label="Resumo financeiro">
      <article class="card balance"><span>Saldo atual</span><strong id="balance">R$ 0,00</strong></article>
      <article class="card income"><span>Entradas</span><strong id="income">R$ 0,00</strong></article>
      <article class="card expense"><span>Saídas</span><strong id="expense">R$ 0,00</strong></article>
    </section>

    <section class="content-grid">
      <form id="transaction-form" class="panel">
        <h2>Nova movimentação</h2>
        <label for="description">Descrição</label>
        <input id="description" type="text" placeholder="Ex.: Mercado" maxlength="50" required />

        <label for="amount">Valor</label>
        <input id="amount" type="number" placeholder="0,00" min="0.01" step="0.01" required />

        <label for="type">Tipo</label>
        <select id="type">
          <option value="income">Entrada</option>
          <option value="expense">Saída</option>
        </select>

        <button type="submit">Adicionar movimentação</button>
      </form>

      <section class="panel transactions">
        <div class="panel-heading">
          <h2>Últimas movimentações</h2>
          <button id="clear-all" class="text-button" type="button">Limpar tudo</button>
        </div>
        <ul id="transaction-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">Ainda não há movimentações. Comece adicionando uma acima.</p>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
